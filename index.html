<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" dir="ltr">
<head>
<title>Chronolarm</title>

<meta charset="UTF-8">
<meta name="author" content="Anh Khoi Do">
<meta name="description" content="The official website of Anh Khoi Do.">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta property="og:url" content="http://anhkhoido.com/chronolarm">
<meta property="og:type" content="website">
<meta property="og:title" content="Chronolarm">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
<link rel="stylesheet" href="style/style.css" />
</head>

<body>


<div id="chronolarm">
    <input type="text" name="workout" id="workout" />&nbsp;<button type="button" class="btn btn-primary" id="incrementLengthWorkout">+</button>&nbsp;<button type="button" class="btn btn-primary" id="decrementLengthWorkout">-</button>
    <br />
    <input type="text" name="set" id="set" />&nbsp;<button type="button" class="btn btn-primary" id="incrementLengthSet">+</button>&nbsp;<button type="button" class="btn btn-primary" id="decrementLengthSet">-</button>
    <br />
    <input type="text" name="break" id="break" />&nbsp;<button type="button" class="btn btn-primary" id="incrementLengthBreak">+</button>&nbsp;<button type="button" class="btn btn-primary" id="decrementLengthBreak">-</button>
    <br />
    <div class="btn-group" role="group" aria-label="Basic example">
        <button type="button" class="btn btn-primary" id="stopButton">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-stop" viewBox="0 0 16 16">
                <path d="M3.5 5A1.5 1.5 0 0 1 5 3.5h6A1.5 1.5 0 0 1 12.5 5v6a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 11zM5 4.5a.5.5 0 0 0-.5.5v6a.5.5 0 0 0 .5.5h6a.5.5 0 0 0 .5-.5V5a.5.5 0 0 0-.5-.5z"/>
              </svg>
        </button>
        <button type="button" class="btn btn-primary" id="playButton">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-play-fill" viewBox="0 0 16 16">
                <path d="m11.596 8.697-6.363 3.692c-.54.313-1.233-.066-1.233-.697V4.308c0-.63.692-1.01 1.233-.696l6.363 3.692a.802.802 0 0 1 0 1.393"/>
            </svg>
        </button>
        <button type="button" class="btn btn-primary" id="pauseButton" onclick="pause_workout();">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-pause-fill" viewBox="0 0 16 16">
                <path d="M5.5 3.5A1.5 1.5 0 0 1 7 5v6a1.5 1.5 0 0 1-3 0V5a1.5 1.5 0 0 1 1.5-1.5m5 0A1.5 1.5 0 0 1 12 5v6a1.5 1.5 0 0 1-3 0V5a1.5 1.5 0 0 1 1.5-1.5"/>
            </svg>
        </button>
    </div>
</div>


<script src="script/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>
<script src="script/script.js"></script>
</body>
</html>
